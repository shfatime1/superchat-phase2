services:
  - type: web
    name: superchat-phase2
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.serve
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      - key: TRAVELPAYOUTS_API_TOKEN
        sync: false
      - key: SUPERCHAT_DATA_MODE
        value: providers
      - key: SHOPPING_PROVIDER
        value: buywhere
      - key: BUYWHERE_MARKET
        value: US
      - key: CINEMA_PROVIDER
        value: auto
      - key: FLIGHT_CURRENCY
        value: AZN
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "8"
      - key: PROVIDER_CONNECT_TIMEOUT_SECONDS
        value: "3"
      - key: PROVIDER_REQUEST_BUDGET_SECONDS
        value: "12"
      - key: PROVIDER_DOMAIN_BUDGET_SECONDS
        value: "20"
      - key: PROVIDER_RETRIES
        value: "2"
      - key: PROVIDER_CACHE_TTL
        value: "1800"
      - key: CHAT_TIMEOUT_SECONDS
        value: "120"
      - key: CHAT_RATE_LIMIT
        value: "30"
      - key: SUPERCHAT_ROUTING_MODE
        value: auto
      - key: COOKIE_SECURE
        value: "true"
